[build]
  command = "node build.js"
  publish = "."

# keep the dashboard out of search engines
[[headers]]
  for = "/admin/*"
  [headers.values]
    X-Robots-Tag = "noindex"

# always fetch the newest product list
[[headers]]
  for = "/products.json"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
